# Shared, platform-agnostic core: pairing, pinned-TLS proxy, notification forwarding and the
# forwarding preferences. Used by the Tauri app (app/src-tauri). The iOS SpringBoard tweak
# (tweak/) does not link it, but reads and writes the same pairing/prefs files.
[package]
name = "framemate-core"
version = "0.3.0"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "framemate_core"

[dependencies]
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
