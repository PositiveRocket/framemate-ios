# Standalone, not part of the root (agent) workspace. This is its own workspace: the Tauri app
# and the shared core.
[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "framemate-app"
description = "FrameMate companion app"
version = "0.3.0"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# Unique lib name avoids a bin/lib name clash (cargo#8519).
name = "framemate_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
framemate-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# System browser / iOS Settings for openExternal and the settings page (replaces the Android
# bridge's openUrl/openAppSettings).
tauri-plugin-opener = "2"

# Mobile-only: the scanner plugin has no desktop implementation.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# JNI entry point for the notification listener (android/.../NotificationBridge.kt); already in
# the tree via Tauri. On iOS the notification source is the SpringBoard tweak (../../tweak), which
# is plain Objective-C and shares only the pairing/prefs files with this app.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# One message to the WKWebView's scroll view (see `fill_the_screen` in src/lib.rs); already in the
# tree via Tauri.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }

[profile.release]
strip = true
lto = "thin"
